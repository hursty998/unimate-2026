name: CI

on:
  pull_request:
    branches: [development]
  push:
    branches: [development]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    name: Foundation
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # pnpm/action-setup v6.1.0 reads the exact packageManager version.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          run_install: false

      # actions/setup-node v7.1.0 reads the committed .node-version.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # Supabase/setup-cli v3.0.1 installs the repository's verified local baseline.
      - uses: Supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359
        with:
          version: 2.120.0

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Start fresh local Supabase
        run: node scripts/ci-supabase.mjs start

      - name: Validate and export local Supabase environment
        run: node scripts/ci-supabase.mjs export-env

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Apply committed migrations from zero
        run: pnpm db:migrate:deploy

      - name: Run canonical foundation verification
        run: |
          mkdir -p .ci-artifacts
          node scripts/verify.mjs --report-json .ci-artifacts/verify.json

      - name: Install Chromium for browser smoke
        run: pnpm exec playwright install --with-deps chromium
        env:
          DATABASE_URL: ""
          DIRECT_URL: ""
          SUPABASE_SECRET_KEY: ""
          SUPABASE_URL: ""

      - name: Install smoke process inspection utility
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y lsof
        env:
          DATABASE_URL: ""
          DIRECT_URL: ""
          SUPABASE_SECRET_KEY: ""
          SUPABASE_URL: ""

      - name: Run durable web smoke
        run: pnpm smoke:web

      # actions/upload-artifact v7.0.2
      - name: Upload safe verification report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        env:
          DATABASE_URL: ""
          DIRECT_URL: ""
          SUPABASE_SECRET_KEY: ""
          SUPABASE_URL: ""
          SUPABASE_STORAGE_BUCKET: ""
        with:
          name: foundation-verification-${{ github.run_id }}
          path: .ci-artifacts/verify.json
          if-no-files-found: ignore
          retention-days: 7
